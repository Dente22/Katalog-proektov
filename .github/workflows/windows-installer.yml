name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Katalog-proektov-Setup
          path: |
            release/Katalog-proektov-Setup-*.exe
            release/update-manifest.json
